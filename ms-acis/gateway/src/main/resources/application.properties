spring.application.name=gateway
server.port=${SERVER_PORT:8080}
spring.cloud.gateway.routes[0].id=auth-users
spring.cloud.gateway.routes[0].uri=${AUTH_USERS_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/usuarios/**
spring.cloud.gateway.routes[1].id=ot-gestion
spring.cloud.gateway.routes[1].uri=${OT_GESTION_URL:http://localhost:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/ordenes/**
spring.cloud.gateway.routes[2].id=terain-photo
spring.cloud.gateway.routes[2].uri=${TERAIN_PHOTO_URL:http://localhost:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/intervenciones/**
jwt.secret=${JWT_SECRET:acis-local-development-signing-key-change-before-deployment-2026}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
