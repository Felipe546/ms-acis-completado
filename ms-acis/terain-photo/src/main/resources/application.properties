spring.application.name=terain-photo
server.port=${SERVER_PORT:8083}
spring.datasource.url=jdbc:h2:file:./data/acis_intervenciones;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
evidencias.dir=${EVIDENCIAS_DIR:uploads/evidencias}
jwt.secret=${JWT_SECRET:acis-local-development-signing-key-change-before-deployment-2026}
ot-gestion.url=${OT_GESTION_URL:http://localhost:8082}
