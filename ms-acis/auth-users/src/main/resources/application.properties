# ===================================================================
# Microservicio ACIS auth-users
# Configuración para entorno de desarrollo local y producción
# ===================================================================

spring.application.name=auth-users
server.port=8081

# Base de datos H2 en archivo para conservar usuarios entre reinicios
spring.datasource.url=jdbc:h2:file:./data/acis_auth_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 para depuración local
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Configuración JWT (Sobre escribible mediante variables de entorno para producción)
# NUNCA guardar claves secretas de producción en el repositorio
jwt.secret=${JWT_SECRET:acis-local-development-signing-key-change-before-deployment-2026}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.com.acis.auth_users=INFO
logging.level.org.springframework.security=WARN
